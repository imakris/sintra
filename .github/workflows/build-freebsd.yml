name: Build & Test - FreeBSD

on:
  workflow_dispatch:
    inputs:
      test_name:
        description: 'Optional top-level test name without sintra_ or .cpp'
        required: false
        default: ''
        type: string
      repetitions:
        description: 'Repetitions when a test name is selected'
        required: false
        default: 1
        type: number
  push:
    branches: [ '*' ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'third_party/**'
      - 'tests/**'
      - 'example/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ '*' ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'third_party/**'
      - 'tests/**'
      - 'example/**'
      - '.github/workflows/**'

jobs:
  freebsd:
    name: FreeBSD Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Restore compiler cache
        id: restore_compiler_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: freebsd-15.0-x86_64-release-ccache-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            freebsd-15.0-x86_64-release-ccache-

      - name: Build and test (FreeBSD 15.0)
        id: vm
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        env:
          SINTRA_TEST_ITERATION_MULTIPLIER: "0.5"
          SINTRA_TEST_NAME: ${{ inputs.test_name }}
          SINTRA_TEST_REPETITIONS: ${{ inputs.repetitions }}
        with:
          release: "15.0"
          usesh: true
          copyback: false
          envs: 'SINTRA_TEST_ITERATION_MULTIPLIER SINTRA_TEST_NAME SINTRA_TEST_REPETITIONS'
          prepare: |
            date +%s > /tmp/ci_start_time
            pkg install -y cmake ninja python ccache
          run: |
            export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
            export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
            export CCACHE_COMPILERCHECK=content
            export CCACHE_MAXSIZE=1GiB
            ccache --zero-stats
            trap 'ccache --show-stats' EXIT
            # run_tests.py's exit status must survive the tee into the test log.
            set -o pipefail

            if [ -n "$SINTRA_TEST_NAME" ]; then
              case "$SINTRA_TEST_NAME" in
                *[!a-zA-Z0-9_]*) echo "Invalid top-level test name" >&2; exit 1 ;;
              esac
              if [ ! -f "tests/$SINTRA_TEST_NAME.cpp" ]; then
                echo "Selected test source does not exist" >&2
                exit 1
              fi
              case "$SINTRA_TEST_REPETITIONS" in
                ''|*[!0-9]*) echo "Repetitions must be a positive integer" >&2; exit 1 ;;
              esac
              if [ "$SINTRA_TEST_REPETITIONS" -lt 1 ]; then
                echo "Repetitions must be a positive integer" >&2
                exit 1
              fi
              printf '%s %s\n' "$SINTRA_TEST_NAME" "$SINTRA_TEST_REPETITIONS" > tests/active_tests.txt
              cmake -S . -B build-focused -G Ninja -DCMAKE_BUILD_TYPE=Release -DSINTRA_BUILD_TESTS=ON \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
              cmake --build build-focused --target "sintra_$SINTRA_TEST_NAME" --parallel 2
              cd tests
              python3 -u run_tests.py --timeout 30 --build-dir ../build-focused --config Release --iteration-multiplier 1 \
                2>&1 | tee "$GITHUB_WORKSPACE/stress-tests.log"
              exit
            fi
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSINTRA_BUILD_TESTS=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build build
            cd tests
            budget=$(( 7200 - $(date +%s) + $(cat /tmp/ci_start_time) ))
            python3 -u run_tests.py --timeout 30 --build-dir ../build --config Release --time-budget $budget \
              2>&1 | tee "$GITHUB_WORKSPACE/stress-tests.log"

      # The VM action skips copyback when its run fails. Export only the compiler
      # cache from the still-running VM, including after a test failure.
      - name: Export compiler cache
        id: export_compiler_cache
        if: always() && steps.restore_compiler_cache.outcome == 'success'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ccache"
          rsync -a --delete --no-owner --no-group --timeout=60 \
            --rsync-path=/usr/local/bin/rsync \
            -e "ssh -o BatchMode=yes -o ConnectTimeout=10" \
            "freebsd:$GITHUB_WORKSPACE/.ccache/" "$GITHUB_WORKSPACE/.ccache/"

      - name: Save compiler cache
        if: always() && steps.export_compiler_cache.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ steps.restore_compiler_cache.outputs.cache-primary-key }}

      # The test log, exported the same way. A failed copy cannot fail the job. A VM without a
      # log (`test -f` exits 1; ssh's own failure is 255) is no failed copy.
      - name: Export test log
        id: export_log
        if: always()
        continue-on-error: true
        run: |
          found=0
          ssh -o BatchMode=yes -o ConnectTimeout=10 freebsd test -f "$GITHUB_WORKSPACE/stress-tests.log" || found=$?
          if [ "$found" -eq 1 ]; then
            echo "The VM has no test log."
            exit 0
          fi
          rsync -a --no-owner --no-group --timeout=60 \
            --rsync-path=/usr/local/bin/rsync \
            -e "ssh -o BatchMode=yes -o ConnectTimeout=10" \
            "freebsd:$GITHUB_WORKSPACE/stress-tests.log" "$RUNNER_TEMP/stress-tests.log"

      # The tables and results that run_tests.py prints after each suite and at the end.
      - name: Summarize stress tests
        if: always()
        continue-on-error: true
        shell: python3 {0}
        env:
          STRESS_OUTCOME: ${{ steps.vm.outcome }}
          EXPORT_OUTCOME: ${{ steps.export_log.outcome }}
        run: |
          import os, pathlib, re

          def tail(lines, max_lines, max_bytes):
              """The last lines within both limits, after a note of how many were left out."""
              kept, size = [], 0
              for line in reversed(lines[-max_lines:]):
                  size += len(line.encode("utf-8")) + 1
                  if size > max_bytes:
                      break
                  kept.append(line)
              kept.reverse()
              if len(kept) < len(lines):
                  kept.insert(0, f"[{len(lines) - len(kept)} earlier lines left out]")
              return kept

          log = pathlib.Path(os.environ["RUNNER_TEMP"], "stress-tests.log")
          outcome = os.environ["STRESS_OUTCOME"]
          if outcome == "skipped":
              body = ["Not run: an earlier step failed or the job was cancelled."]
          elif not log.is_file():
              body = ["The test log could not be copied from the VM."
                      if os.environ.get("EXPORT_OUTCOME") == "failure" else "No test log was written."]
          else:
              lines = [re.sub(r"\x1b\[[0-9;]*m", "", line) for line in
                       log.read_text(encoding="utf-8", errors="replace").splitlines()]
              block, keep = [], False
              for line in lines:
                  if re.match(r"Configuration \d+/\d+: ", line):
                      keep = False
                  if line.startswith("Results for ") or line == "OVERALL SUMMARY":
                      keep = True
                  if keep:
                      block.append(line)
              # The step summary is capped well under GitHub's 1 MiB per step.
              body = ["```text", *(tail(block, 3000, 200_000) or ["No suite results in the log."]),
                      "```"]
              if "OVERALL SUMMARY" not in lines:
                  body = [f"**The run did not finish** (build and test step: {outcome}): the log "
                          "has no OVERALL SUMMARY. The results so far, then the last lines of the log:",
                          *body, "```text", *(tail(lines, 40, 40_000) or ["The log is empty."]),
                          "```"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(["### Stress tests", *body]) + "\n")

      - name: Upload test log
        if: always() && steps.vm.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: freebsd-stress-tests-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stress-tests.log
          if-no-files-found: warn
          retention-days: 7
