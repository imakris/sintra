name: Stress Test - macOS (reusable)

on:
  workflow_call:
    inputs:
      build_run_id:
        description: "Actions run id of the build that produced artifacts"
        required: true
        type: string
      head_sha:
        description: "Commit SHA to test (head of PR or push)"
        required: true
        type: string
      base_sha:
        description: "Base commit SHA for diff detection (PR base, or the push's previous head)"
        required: false
        type: string
      branch:
        description: "Branch name (PR head ref or push ref)"
        required: false
        type: string
      pr_number:
        description: "PR number if this came from a PR"
        required: false
        type: string
      full_run:
        description: "Complete the multiplier-1 Debug/Release schedule without a time budget"
        required: false
        type: boolean
        default: false
      force_tests:
        description: "Run tests even when path filters do not match"
        required: false
        type: boolean
        default: false
    secrets:
      repository-token:
        description: "GitHub token forwarded from the caller workflow"
        required: true
      gist-secret:
        description: "Gist token for badge updates"
        required: false

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: stress-${{ inputs.head_sha }}-macos
  cancel-in-progress: false

jobs:
  stress-test:
    name: Stress Test
    runs-on: macos-15
    env:
      GITHUB_TOKEN: ${{ secrets.repository-token }}

    steps:
      - name: Set context env
        shell: bash
        run: |
          echo "RUN_ID=${{ inputs.build_run_id }}" >> "$GITHUB_ENV"
          echo "HEAD_SHA=${{ inputs.head_sha }}" >> "$GITHUB_ENV"
          echo "BASE_SHA=${{ inputs.base_sha || '' }}" >> "$GITHUB_ENV"
          echo "HEAD_BRANCH=${{ inputs.branch || '' }}" >> "$GITHUB_ENV"
          echo "PR_NUMBER=${{ inputs.pr_number || '' }}" >> "$GITHUB_ENV"

      - name: Context
        if: always()
        shell: bash
        run: |
          {
            echo "### Source";
            if [ -n "${PR_NUMBER}" ]; then
              echo "- PR: #${PR_NUMBER}";
            else
              echo "- PR: -";
            fi
            if [ -n "${HEAD_BRANCH}" ]; then
              echo "- Branch: ${HEAD_BRANCH}";
            else
              echo "- Branch: -";
            fi
            echo "- Commit: ${HEAD_SHA}";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Determine diff base
        id: diff-base
        shell: bash
        run: |
          set -euo pipefail
          # A push passes its previous head, so the diff covers every commit of the push. That
          # base is all zeros for a new branch and may be missing after a force push; the
          # parent of the head is the fallback then.
          if [ -n "${BASE_SHA}" ] && [ -n "${BASE_SHA//0/}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            base_commit="$BASE_SHA"
          else
            if [ -n "${BASE_SHA}" ]; then
              echo "Diff base ${BASE_SHA} is not usable; using the parent of ${HEAD_SHA}."
            fi
            read -ra parents <<< "$(git rev-list --parents -n 1 "${HEAD_SHA}")"
            if [ "${#parents[@]}" -ge 3 ]; then
              parent1="${parents[1]}"
              parent2="${parents[2]}"
              if git diff --quiet "$parent1" "${HEAD_SHA}"; then
                base_commit="$parent2"
              else
                base_commit="$parent1"
              fi
            elif git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
              base_commit="$(git rev-parse "${HEAD_SHA}^")"
            else
              base_commit="$HEAD_SHA"
            fi
          fi
          echo "base=$base_commit" >> "$GITHUB_OUTPUT"

      - name: Detect changed areas
        id: changed
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          base: ${{ steps.diff-base.outputs.base }}
          filters: |
            core:
              - 'src/**'
              - 'include/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'third_party/**'
            tests:
              - 'tests/**'
            examples:
              - 'example/**'
            workflows:
              - '.github/workflows/**'

      - name: Verify LLDB availability
        run: |
          if ! xcrun -f lldb >/dev/null 2>&1; then
            echo "::error::lldb not available via xcrun. Install Xcode Command Line Tools to provide LLDB." >&2
            exit 1
          fi
          xcrun lldb --version

      - name: Enable debugger attachments and core dumps
        shell: bash
        run: |
          sudo /usr/sbin/DevToolsSecurity -enable
          sudo dscl . append /Groups/_developer GroupMembership "$(whoami)" || true
          sudo mkdir -p /cores
          sudo chmod 1777 /cores
          sudo launchctl limit core unlimited unlimited
          sudo sysctl kern.corefile=core.%P || true

      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: macos-build-${{ env.HEAD_SHA }}
          path: build/
          github-token: ${{ secrets.repository-token }}
          run-id: ${{ env.RUN_ID }}
      - name: Verify artifacts present
        run: |
          if [ ! -d build ]; then
            echo "Expected build artifacts were not downloaded" >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Make test executables executable
        shell: bash
        run: |
          if [ -d build/tests ]; then
            find build/tests -type f -exec chmod +x {} +
          fi

      - name: Run stress tests with run_tests.py
        id: stress
        if: inputs.full_run || inputs.force_tests || steps.changed.outputs.tests == 'true' || steps.changed.outputs.core == 'true' || steps.changed.outputs.workflows == 'true'
        shell: bash
        env:
          FULL_RUN: ${{ inputs.full_run }}
        run: |
          ulimit -c unlimited
          cd tests
          runner_args=(--timeout 30 --build-dir ../build --config Debug,Release --iteration-multiplier 1)
          if [ "$FULL_RUN" != true ]; then
            runner_args+=(--time-budget 7200)
          fi
          python -u run_tests.py "${runner_args[@]}" 2>&1 | tee "$RUNNER_TEMP/stress-tests.log"

      # The tables and results that run_tests.py prints after each suite and at the end.
      - name: Summarize stress tests
        if: always()
        continue-on-error: true
        shell: python3 {0}
        env:
          STRESS_OUTCOME: ${{ steps.stress.outcome }}
          JOB_STATUS: ${{ job.status }}
          DIFF_BASE: ${{ steps.diff-base.outputs.base }}
        run: |
          import os, pathlib, re
          log = pathlib.Path(os.environ["RUNNER_TEMP"], "stress-tests.log")
          if os.environ["STRESS_OUTCOME"] == "skipped":
              if os.environ["JOB_STATUS"] == "success":
                  body = ["Skipped: no core, test or workflow change since "
                          f"{os.environ.get('DIFF_BASE', '')}."]
              else:
                  body = ["Not run: an earlier step failed or the job was cancelled."]
          elif not log.is_file():
              body = ["No test log was written."]
          else:
              block, keep = [], False
              for line in log.read_text(encoding="utf-8", errors="replace").splitlines():
                  line = re.sub(r"\x1b\[[0-9;]*m", "", line)
                  if re.match(r"Configuration \d+/\d+: ", line):
                      keep = False
                  if line.startswith("Results for ") or line == "OVERALL SUMMARY":
                      keep = True
                  if keep:
                      block.append(line)
              block = block[-3000:] or ["No final summary in the log."]
              body = ["```text", *block, "```"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(["### Stress tests", *body]) + "\n")

      - name: Upload stress test log
        if: always() && steps.stress.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-stress-tests-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stress-tests.log
          if-no-files-found: warn
          retention-days: 7

      # A skipped test step still reports success, which GitHub needs to merge, but says so.
      - name: Mark status success
        if: success()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          STRESS_OUTCOME: ${{ steps.stress.outcome }}
          DIFF_BASE: ${{ steps.diff-base.outputs.base }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const sha = process.env.HEAD_SHA;
            const branch = process.env.HEAD_BRANCH;
            const prNumber = process.env.PR_NUMBER;
            const statusContext = 'Stress Test (macOS)';
            const verdict = process.env.STRESS_OUTCOME === 'skipped'
              ? `Stress Test skipped: no core, test or workflow change since ${process.env.DIFF_BASE.slice(0, 8)}`
              : 'Stress Test passed';
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: 'success',
              context: statusContext,
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              description: `${verdict}${branch ? ` on ${branch}` : ''}${prNumber ? ` (PR #${prNumber})` : ''}`.slice(0, 140)
            });

      - name: Mark status failure
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const sha = process.env.HEAD_SHA;
            const branch = process.env.HEAD_BRANCH;
            const prNumber = process.env.PR_NUMBER;
            const statusContext = 'Stress Test (macOS)';
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: 'failure',
              context: statusContext,
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              description: `Stress Test failed${branch ? ` on ${branch}` : ''}${prNumber ? ` (PR #${prNumber})` : ''}`
            });

      # A skipped test step leaves the badge at the last real result; a cancelled run is grey.
      - name: Update tests badge
        if: always() && inputs.branch == 'master' && inputs.pr_number == '' && !(job.status == 'success' && steps.stress.outcome == 'skipped')
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.gist-secret }}
          gistID: 38c12e638eddbbfad6962730f6b10d20
          filename: sintra-macos-tests.json
          label: Tests
          message: ${{ job.status }}
          color: ${{ job.status == 'success' && 'green' || job.status == 'cancelled' && 'lightgrey' || 'red' }}
