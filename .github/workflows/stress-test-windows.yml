name: Stress Test - Windows (reusable)

on:
  workflow_call:
    inputs:
      build_run_id:
        description: "Actions run id of the build that produced artifacts"
        required: true
        type: string
      head_sha:
        description: "Commit SHA to test (head of PR or push)"
        required: true
        type: string
      base_sha:
        description: "Base commit SHA for diff detection (PR base, or the push's previous head)"
        required: false
        type: string
      branch:
        description: "Branch name (PR head ref or push ref)"
        required: false
        type: string
      pr_number:
        description: "PR number if this came from a PR"
        required: false
        type: string
      full_run:
        description: "Complete the multiplier-1 Debug/Release schedule without a time budget"
        required: false
        type: boolean
        default: false
      force_tests:
        description: "Run tests even when path filters do not match"
        required: false
        type: boolean
        default: false
      lane:
        description: "Windows compiler lane used to isolate stress-test concurrency"
        required: false
        type: string
        default: windows
      report_status:
        description: "Update the primary Windows test status and badge"
        required: false
        type: boolean
        default: true
    secrets:
      repository-token:
        description: "GitHub token forwarded from the caller workflow"
        required: true
      gist-secret:
        description: "Gist token for badge updates"
        required: false

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: stress-${{ inputs.head_sha }}-${{ inputs.lane }}
  cancel-in-progress: false

jobs:
  stress-test:
    name: Stress Test
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.repository-token }}
      # The context reaches scripts only through the environment: a pull request's branch name
      # is chosen by its author and must not be interpolated into a script.
      RUN_ID: ${{ inputs.build_run_id }}
      HEAD_SHA: ${{ inputs.head_sha }}
      BASE_SHA: ${{ inputs.base_sha || '' }}
      HEAD_BRANCH: ${{ inputs.branch || '' }}
      PR_NUMBER: ${{ inputs.pr_number || '' }}

    steps:
      - name: Context
        if: always()
        shell: bash
        run: |
          {
            echo "### Source";
            if [ -n "${PR_NUMBER}" ]; then
              echo "- PR: #${PR_NUMBER}";
            else
              echo "- PR: -";
            fi
            if [ -n "${HEAD_BRANCH}" ]; then
              echo "- Branch: ${HEAD_BRANCH}";
            else
              echo "- Branch: -";
            fi
            echo "- Commit: ${HEAD_SHA}";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Determine diff base
        id: diff-base
        shell: bash
        run: |
          set -euo pipefail
          # A push passes its previous head, so the diff covers every commit of the push. That
          # base is all zeros for a new branch and may be missing from the clone after a force
          # push. Then nothing shows what the push changed, and the tests run (force).
          force=false
          if [ -n "${BASE_SHA}" ] && [ -n "${BASE_SHA//0/}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            base_commit="$BASE_SHA"
          else
            if [ -n "${BASE_SHA}" ]; then
              echo "Diff base ${BASE_SHA} is not usable; the tests run whatever the changed paths."
              force=true
            fi
            read -ra parents <<< "$(git rev-list --parents -n 1 "${HEAD_SHA}")"
            if [ "${#parents[@]}" -ge 3 ]; then
              parent1="${parents[1]}"
              parent2="${parents[2]}"
              if git diff --quiet "$parent1" "${HEAD_SHA}"; then
                base_commit="$parent2"
              else
                base_commit="$parent1"
              fi
            elif git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
              base_commit="$(git rev-parse "${HEAD_SHA}^")"
            else
              base_commit="$HEAD_SHA"
            fi
          fi
          echo "base=$base_commit" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"

      # `ref` binds the comparison to the tested commit, not to the branch's current tip.
      # A pull request ignores both inputs and asks the API for the PR's files.
      - name: Detect changed areas
        id: changed
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          base: ${{ steps.diff-base.outputs.base }}
          ref: ${{ env.HEAD_SHA }}
          filters: |
            core:
              - 'src/**'
              - 'include/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'third_party/**'
            tests:
              - 'tests/**'
            examples:
              - 'example/**'
            workflows:
              - '.github/workflows/**'

      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-build-${{ env.HEAD_SHA }}
          path: build/
          github-token: ${{ secrets.repository-token }}
          run-id: ${{ env.RUN_ID }}
      - name: Verify artifacts present
        shell: bash
        run: |
          for config in Debug Release; do
            test_binary="build/tests/${config}/sintra_dummy_test.exe"
            if [ ! -f "$test_binary" ]; then
              echo "Expected test artifact was not downloaded: $test_binary" >&2
              exit 1
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Ensure native Windows debugger
        if: inputs.full_run || inputs.force_tests || steps.diff-base.outputs.force == 'true' || steps.changed.outputs.tests == 'true' || steps.changed.outputs.core == 'true' || steps.changed.outputs.workflows == 'true'
        shell: pwsh
        run: |
          function Find-NativeDebugger {
            foreach ($root in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
              $candidate = Join-Path $root 'Windows Kits/10/Debuggers/x64/cdb.exe'
              if (Test-Path -LiteralPath $candidate) { return $candidate }
            }
          }
          $debugger = Find-NativeDebugger
          if (-not $debugger) {
            # Official Windows SDK installer; install only Debugging Tools.
            # https://learn.microsoft.com/windows/apps/windows-sdk/downloads
            $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2376217' -OutFile $installer
            $signature = Get-AuthenticodeSignature -FilePath $installer
            if ($signature.Status -ne 'Valid' -or
                $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation') {
              throw 'Windows SDK installer signature is not valid for Microsoft Corporation'
            }
            $installation = Start-Process -FilePath $installer -ArgumentList @(
              '/features', 'OptionId.WindowsDesktopDebuggers', '/quiet', '/norestart'
            ) -Wait -PassThru -WindowStyle Hidden
            if ($installation.ExitCode -notin @(0, 3010, 1641)) {
              throw "Windows debugger installation failed: $($installation.ExitCode)"
            }
            $debugger = Find-NativeDebugger
          }
          if (-not $debugger) { throw 'Native x64 CDB is required for Windows test diagnostics' }
          & $debugger -version
          if ($LASTEXITCODE -ne 0) { throw "CDB could not run: $LASTEXITCODE" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path $debugger)

      - name: Run stress tests with run_tests.py
        id: stress
        if: inputs.full_run || inputs.force_tests || steps.diff-base.outputs.force == 'true' || steps.changed.outputs.tests == 'true' || steps.changed.outputs.core == 'true' || steps.changed.outputs.workflows == 'true'
        shell: pwsh
        env:
          FULL_RUN: ${{ inputs.full_run }}
          SINTRA_PRESERVE_SCRATCH: "1"
        run: |
          Set-Location tests
          $runner_args = @('--timeout', '30', '--build-dir', '../build', '--config', 'Debug,Release', '--iteration-multiplier', '1')
          if ($env:FULL_RUN -ne 'true') {
            $runner_args += @('--time-budget', '7200')
          }
          python -u run_tests.py @runner_args 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'stress-tests.log')
          exit $LASTEXITCODE

      # Its output, one result line per check and any error that stops the checks are appended
      # to the test log. The step fails exactly as before: at the first missing executable or
      # non-zero exit.
      - name: Check closed-handle process absence directly
        id: absence
        if: inputs.full_run || inputs.force_tests || steps.diff-base.outputs.force == 'true' || steps.changed.outputs.tests == 'true' || steps.changed.outputs.core == 'true' || steps.changed.outputs.workflows == 'true'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'stress-tests.log'
          Add-Content -LiteralPath $log -Value '', '== Closed-handle absence checks =='
          try {
            foreach ($config in @('Debug', 'Release')) {
              foreach ($test in @('process_identity_test', 'copying_mark_lifecycle_test')) {
                $binary = Join-Path $PWD "build/tests/$config/sintra_${test}.exe"
                if (-not (Test-Path -LiteralPath $binary)) {
                  Add-Content -LiteralPath $log -Value "[absence check] $test ${config}: failed, the executable is missing"
                  throw "Expected absence test artifact was not downloaded: $binary"
                }
                & $binary --absence-only 2>&1 | Tee-Object -FilePath $log -Append
                $code = $LASTEXITCODE
                $result = if ($code -eq 0) { 'passed' } else { "failed with exit code $code" }
                Add-Content -LiteralPath $log -Value "[absence check] $test ${config}: $result"
                if ($code -ne 0) {
                  throw "$test --absence-only failed in $config with exit code $code"
                }
              }
            }
          } catch {
            Add-Content -LiteralPath $log -Value "[absence check] stopped: $_"
            throw
          }

      # The tables and results that run_tests.py prints after each suite and at the end, then
      # the outcome of the closed-handle absence checks.
      - name: Summarize stress tests
        if: always()
        continue-on-error: true
        shell: python
        env:
          STRESS_OUTCOME: ${{ steps.stress.outcome }}
          ABSENCE_OUTCOME: ${{ steps.absence.outcome }}
          JOB_STATUS: ${{ job.status }}
          DIFF_BASE: ${{ steps.diff-base.outputs.base }}
        run: |
          import os, pathlib, re

          def tail(lines, max_lines, max_bytes):
              """The last lines within both limits, after a note of how many were left out."""
              kept, size = [], 0
              for line in reversed(lines[-max_lines:]):
                  size += len(line.encode("utf-8")) + 1
                  if size > max_bytes:
                      break
                  kept.append(line)
              kept.reverse()
              if len(kept) < len(lines):
                  kept.insert(0, f"[{len(lines) - len(kept)} earlier lines left out]")
              return kept

          log = pathlib.Path(os.environ["RUNNER_TEMP"], "stress-tests.log")
          outcome = os.environ["STRESS_OUTCOME"]
          if outcome == "skipped":
              if os.environ["JOB_STATUS"] == "success":
                  body = ["Skipped: no core, test or workflow change since "
                          f"{os.environ.get('DIFF_BASE', '')}."]
              else:
                  body = ["Not run: an earlier step failed or the job was cancelled."]
          elif not log.is_file():
              body = ["No test log was written."]
          else:
              lines = [re.sub(r"\x1b\[[0-9;]*m", "", line) for line in
                       log.read_text(encoding="utf-8", errors="replace").splitlines()]
              block, keep = [], False
              for line in lines:
                  if line == "== Closed-handle absence checks ==":
                      break
                  if re.match(r"Configuration \d+/\d+: ", line):
                      keep = False
                  if line.startswith("Results for ") or line == "OVERALL SUMMARY":
                      keep = True
                  if keep:
                      block.append(line)
              # The step summary is capped well under GitHub's 1 MiB per step.
              body = ["```text", *(tail(block, 3000, 200_000) or ["No suite results in the log."]),
                      "```"]
              if "OVERALL SUMMARY" not in lines:
                  body = [f"**The run did not finish** (test step: {outcome}): the log has no "
                          "OVERALL SUMMARY. The results so far, then the last lines of the log:",
                          *body, "```text", *(tail(lines, 40, 40_000) or ["The log is empty."]),
                          "```"]
              absence = os.environ.get("ABSENCE_OUTCOME", "")
              results = [line[len("[absence check] "):] for line in lines
                         if line.startswith("[absence check] ")]
              checks = [result for result in results if not result.startswith("stopped: ")]
              if absence == "skipped":
                  body.append("Closed-handle absence checks: not run (they run only after "
                              "run_tests.py passed).")
              elif absence or results:
                  failed = sum(1 for check in checks if not check.endswith(": passed"))
                  verdict = (f"Closed-handle absence checks: {len(checks) - failed} passed, "
                             f"{failed} failed (step: {absence or 'unknown'})")
                  body += [verdict if absence == "success" else f"**{verdict}**", "```text",
                           *(tail(results, 20, 20_000) or ["No check result was recorded."]),
                           "```"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(["### Stress tests", *body]) + "\n")

      - name: Upload stress test log
        if: always() && steps.stress.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.lane }}-stress-tests-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stress-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: List preserved scratch (failure only)
        if: failure()
        shell: pwsh
        run: |
          Write-Host "Searching for preserved scratch under build/"
          if (Test-Path build) {
            Get-ChildItem -Force -Path build -Filter ".sintra-test-scratch*" | ForEach-Object {
              Write-Host "scratch root: $($_.FullName)"
            }
            Get-ChildItem -Force -Recurse -Path build -Filter "trace.log" | Where-Object {
              $_.FullName -like "*sintra-test-scratch*"
            } | ForEach-Object {
              Write-Host "trace file: $($_.FullName)"
            }
          } else {
            Write-Warning "build directory not found"
          }

      - name: Upload preserved scratch artifacts (failure only)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-scratch-${{ github.run_id }}
          path: |
            build/.sintra-test-scratch-*/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      # Skipped tests post a status only on a pull request, where a merge may wait for it; it
      # says skipped. On a push a green status would read as a pass, so none is posted.
      - name: Publish test status
        if: >-
          inputs.report_status && !cancelled() &&
          (failure() || steps.stress.outcome != 'skipped' || github.event_name == 'pull_request')
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TEST_STATUS: ${{ job.status }}
          STRESS_OUTCOME: ${{ steps.stress.outcome }}
          DIFF_BASE: ${{ steps.diff-base.outputs.base }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const sha = process.env.HEAD_SHA;
            const branch = process.env.HEAD_BRANCH;
            const prNumber = process.env.PR_NUMBER;
            const statusContext = 'Stress Test (Windows)';
            const state = process.env.TEST_STATUS;
            let verdict = state === 'success' ? 'Stress Test passed' : 'Stress Test failed';
            if (process.env.STRESS_OUTCOME === 'skipped') {
              verdict = state === 'success'
                ? `Stress Test skipped: no core, test or workflow change since ${process.env.DIFF_BASE.slice(0, 8)}`
                : 'Stress Test could not run: a setup step failed before the tests';
            }
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state,
              context: statusContext,
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              description: `${verdict}${branch ? ` on ${branch}` : ''}${prNumber ? ` (PR #${prNumber})` : ''}`.slice(0, 140)
            });

      # Only a test step that started writes the badge, so setup failures, skips and
      # cancellations before the tests leave the last real result. A cancelled run is grey.
      - name: Update tests badge
        if: inputs.report_status && always() && inputs.branch == 'master' && inputs.pr_number == '' && (steps.stress.outcome == 'success' || steps.stress.outcome == 'failure' || steps.stress.outcome == 'cancelled')
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        env:
          TEST_OUTCOME: >-
            ${{ steps.stress.outcome != 'success' && steps.stress.outcome ||
                steps.absence.outcome == 'skipped' && 'cancelled' || steps.absence.outcome }}
        with:
          auth: ${{ secrets.gist-secret }}
          gistID: 38c12e638eddbbfad6962730f6b10d20
          filename: sintra-windows-tests.json
          label: Tests
          message: ${{ env.TEST_OUTCOME }}
          color: ${{ env.TEST_OUTCOME == 'success' && 'green' || env.TEST_OUTCOME == 'cancelled' && 'lightgrey' || 'red' }}
